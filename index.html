<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <title>Daily AI Robotics Briefing — October 19, 2026</title>
  <style>

    :root {
      color-scheme: light dark;
      --paper: #f7f8fa;
      --sheet: #ffffff;
      --ink: #17191d;
      --body: #30343b;
      --muted: #626973;
      --rule: #daddE3;
      --soft: #eef1f5;
      --blue: #1a73e8;
      --blue-soft: #eaf2fe;
      --orange: #e8710a;
      --orange-soft: #fff0e3;
      --purple: #7b1fa2;
      --purple-soft: #f4eafb;
      --shadow: 0 24px 70px rgba(19, 30, 49, .09);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111317;
        --sheet: #191c21;
        --ink: #f2f4f7;
        --body: #d2d6dd;
        --muted: #a0a7b2;
        --rule: #343942;
        --soft: #23272e;
        --blue: #72aaf5;
        --blue-soft: #172a43;
        --orange: #f1a45e;
        --orange-soft: #372416;
        --purple: #c58adb;
        --purple-soft: #30203a;
        --shadow: 0 24px 70px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--body);
      font-family: "Poppins", sans-serif;
      font-size: 17px;
      line-height: 1.68;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    a:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 4px;
      border-radius: 3px;
    }
    .site-shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 920px);
      align-items: start;
      gap: 26px;
      width: min(1196px, calc(100% - 40px));
      margin: 34px auto 64px;
    }
    .page {
      width: 100%;
      min-width: 0;
      margin: 0;
      background: var(--sheet);
      box-shadow: var(--shadow);
    }
    .archive-nav {
      position: sticky;
      top: 24px;
      padding: 22px 20px 24px;
      background: var(--sheet);
      border-top: 5px solid var(--ink);
      box-shadow: 0 12px 38px rgba(19, 30, 49, .08);
    }
    .archive-nav-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: .67rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .archive-nav h2 {
      margin: 0 0 18px;
      color: var(--ink);
      font-size: 1.35rem;
      line-height: 1.15;
      letter-spacing: -.02em;
    }
    .archive-nav a {
      color: var(--body);
      text-decoration: none;
    }
    .latest-link {
      display: block;
      margin-bottom: 15px;
      padding: 11px 12px;
      background: var(--blue-soft);
      color: var(--blue) !important;
      font-size: .81rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .week-group { border-top: 1px solid var(--rule); }
    .week-group:last-child { border-bottom: 1px solid var(--rule); }
    .week-group > summary {
      position: relative;
      padding: 13px 24px 13px 0;
      color: var(--ink);
      cursor: pointer;
      list-style: none;
      font-size: .78rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .week-group > summary::-webkit-details-marker { display: none; }
    .week-group > summary::after {
      content: "+";
      position: absolute;
      right: 3px;
      top: 50%;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
      transform: translateY(-50%);
    }
    .week-group[open] > summary::after { content: "−"; }
    .week-group > summary:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }
    .week-links {
      display: grid;
      gap: 2px;
      padding: 0 0 11px;
    }
    .week-group:not([open]) > .week-links { display: none; }
    .week-links a {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      font-size: .76rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .week-links a span { color: var(--muted); font-weight: 500; }
    .week-links a:hover,
    .week-links a:focus-visible {
      background: var(--soft);
      color: var(--blue);
    }
    .mobile-nav-toggle,
    .nav-close,
    .nav-backdrop { display: none; }
    .issue-head {
      padding: 54px 64px 36px;
      border-top: 6px solid var(--blue);
    }
    .week-strip {
      display: flex;
      gap: 6px;
      margin: 0 0 20px;
    }
    .week-strip .day-chip {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 40px;
      padding: 7px 0 6px;
      border-radius: 12px;
      color: var(--muted);
    }
    .week-strip .day-chip .glyph {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--muted) 45%, transparent);
      font-size: .78rem;
      font-weight: 700;
      line-height: 1;
    }
    .week-strip .day-chip .dow {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .week-strip .day-chip.is-issue {
      color: var(--blue);
    }
    .week-strip .day-chip.is-issue .glyph {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .week-strip .day-chip.is-today .today-dot {
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dateline {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: .77rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 720px;
      color: var(--ink);
      font-family: "Poppins", sans-serif;
      font-size: clamp(2.35rem, 7vw, 4.6rem);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 700;
    }
    .dek {
      max-width: 650px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.55;
    }
    .issue-index {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0 64px 38px;
      gap: 1px;
      background: linear-gradient(var(--sheet), var(--sheet)) padding-box;
    }
    .index-link {
      display: block;
      padding: 15px 17px 16px;
      background: var(--soft);
      color: var(--ink);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .index-link span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 600;
    }
    .index-link.papers { border-top: 4px solid var(--blue); }
    .index-link.discussions { border-top: 4px solid var(--orange); }
    .index-link.podcasts { border-top: 4px solid var(--purple); }
    .index-link:hover { filter: brightness(.97); }

    .section {
      --accent: var(--blue);
      --tint: var(--blue-soft);
      padding: 45px 64px 20px;
      border-top: 1px solid var(--rule);
      scroll-margin-top: 24px;
    }
    .section.discussions { --accent: var(--orange); --tint: var(--orange-soft); }
    .section.podcasts { --accent: var(--purple); --tint: var(--purple-soft); padding-bottom: 44px; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 4px;
    }
    h2 {
      margin: 0;
      color: var(--accent);
      font-family: "Poppins", sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.65rem);
      line-height: 1.05;
      letter-spacing: -.025em;
    }
    .count {
      color: var(--muted);
      font-size: .77rem;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .section-rule {
      height: 3px;
      width: 58px;
      margin: 15px 0 4px;
      background: var(--accent);
    }
    .entry {
      padding: 34px 0 36px;
      border-bottom: 1px solid var(--rule);
    }
    .entry:last-child { border-bottom: 0; }
    .entry-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      margin-bottom: 11px;
      border-radius: 50%;
      background: var(--tint);
      color: var(--accent);
      font-size: .76rem;
      font-weight: 800;
    }
    h3 {
      max-width: 710px;
      margin: 0;
      color: var(--ink);
      font-family: "Poppins", sans-serif;
      font-size: clamp(1.35rem, 3.5vw, 1.8rem);
      line-height: 1.22;
      letter-spacing: -.018em;
    }
    .summary {
      max-width: 710px;
      margin: 13px 0 0;
    }
    figure {
      max-width: 560px;
      margin: 22px 0 0;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      background: var(--soft);
    }
    figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.4;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 19px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--rule);
      color: var(--accent);
      background: var(--sheet);
      font-size: .84rem;
      font-weight: 750;
      line-height: 1;
      text-decoration: none;
    }
    .links a::after { content: "↗"; font-size: .9em; }
    .links a:hover {
      border-color: var(--accent);
      background: var(--tint);
    }
    .empty-note {
      margin: 28px 0 8px;
      padding: 21px 22px;
      background: var(--tint);
      color: var(--body);
    }
    .source-note {
      padding: 27px 64px 31px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.55;
    }
    .source-note strong { color: var(--ink); }

    .archive {
      padding: 48px 64px 58px;
      border-top: 7px solid var(--ink);
    }
    .archive-head { margin-bottom: 25px; }
    .archive-head h2 { color: var(--ink); }
    .archive-head > p:last-child {
      max-width: 610px;
      margin: 14px 0 0;
      color: var(--muted);
    }
    .archive-day { border-top: 1px solid var(--rule); scroll-margin-top: 28px; }
    .archive-day:last-child { border-bottom: 1px solid var(--rule); }
    .archive-day > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 68px;
      padding: 15px 0;
      color: var(--ink);
      cursor: pointer;
      list-style: none;
      font-family: "Poppins", sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .archive-day > summary::-webkit-details-marker { display: none; }
    .archive-day > summary:hover .archive-toggle { color: var(--blue); }
    .archive-day > summary:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }
    .archive-toggle {
      color: var(--muted);
      font-family: "Poppins", sans-serif;
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .archive-day[open] .archive-toggle { font-size: 0; }
    .archive-day[open] .archive-toggle::after { content: "Close"; font-size: .75rem; }
    .archive-body { padding: 2px 0 42px; color: var(--body); }
    .archive-body > p:first-child { margin-top: 2px; }
    .archive-body .archive-section-title {
      margin: 31px 0 0;
      font-family: "Poppins", sans-serif;
      font-size: 1.5rem;
      line-height: 1.2;
    }
    .archive-body .papers-title { color: var(--blue); }
    .archive-body .discussions-title { color: var(--orange); }
    .archive-body .podcasts-title { color: var(--purple); }
    .archive-body ul { margin: 4px 0 0; padding: 0; list-style: none; }
    .archive-body li { padding: 21px 0 23px; border-bottom: 1px solid var(--rule); }
    .archive-body li:last-child { border-bottom: 0; }
    .archive-body li > div:first-child {
      color: var(--ink);
      font-family: "Poppins", sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.32;
    }
    .archive-body li > div:nth-child(2) { margin-top: 8px; }
    .archive-body li > div:last-child:not(:nth-child(2)) { margin-top: 12px; }
    .archive-body a { color: var(--blue); font-weight: 700; text-underline-offset: 3px; }
    .archive-body .discussions-title + ul a { color: var(--orange); }
    .archive-body .podcasts-title + ul a { color: var(--purple); }
    .archive-body hr { display: none; }
    .archive-body figure { max-width: 610px; margin: 18px 0 2px; }
    .archive-body figure img { width: 100%; height: auto; background: var(--soft); }
    .archive-note { margin: 26px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.55; }
    @media (max-width: 780px) {
      body { font-size: 16px; background: var(--sheet); }
      .site-shell { display: block; width: 100%; margin: 0; }
      .page { width: 100%; margin: 0; box-shadow: none; }
      .mobile-nav-toggle {
        position: fixed;
        z-index: 40;
        top: 12px;
        right: 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 9px 13px;
        border: 1px solid var(--rule);
        background: var(--sheet);
        color: var(--ink);
        box-shadow: 0 5px 20px rgba(19, 30, 49, .12);
        font: 700 .76rem/1 "Poppins", sans-serif;
        cursor: pointer;
      }
      .mobile-nav-toggle::before {
        content: "";
        width: 15px;
        height: 11px;
        border-top: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
      }
      .archive-nav {
        position: fixed;
        z-index: 50;
        inset: 0 auto 0 0;
        width: min(84vw, 330px);
        max-height: none;
        overflow-y: auto;
        padding: 29px 22px 32px;
        border-top: 0;
        border-right: 1px solid var(--rule);
        box-shadow: 16px 0 50px rgba(0, 0, 0, .22);
        visibility: hidden;
        transform: translateX(-105%);
        transition: transform .22s ease, visibility 0s linear .22s;
      }
      .nav-close {
        position: absolute;
        top: 18px;
        right: 16px;
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 1px solid var(--rule);
        background: var(--sheet);
        color: var(--ink);
        font: 500 1.25rem/1 "Poppins", sans-serif;
        cursor: pointer;
      }
      .nav-backdrop {
        position: fixed;
        z-index: 45;
        inset: 0;
        display: block;
        background: rgba(8, 10, 14, .48);
        opacity: 0;
        pointer-events: none;
        transition: opacity .22s ease;
      }
      body.nav-open { overflow: hidden; }
      body.nav-open .archive-nav {
        visibility: visible;
        transform: translateX(0);
        transition: transform .22s ease;
      }
      body.nav-open .nav-backdrop { opacity: 1; pointer-events: auto; }
      .issue-head { padding: 78px 22px 28px; }
      .issue-index { grid-template-columns: 1fr; padding: 0 22px 28px; gap: 7px; }
      .index-link { padding: 12px 14px; }
      .section { padding: 37px 22px 14px; }
      .section.podcasts { padding-bottom: 34px; }
      .section-heading { align-items: flex-end; }
      .entry { padding: 29px 0 31px; }
      figure { margin-top: 18px; }
      .source-note { padding: 24px 22px 28px; }
      .archive { padding: 38px 22px 48px; }
      .archive-day > summary { min-height: 62px; font-size: 1.08rem; }
      .archive-body { padding-bottom: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print {
      body, .page { background: #fff; color: #222; }
      .site-shell { display: block; width: 100%; margin: 0; }
      .archive-nav, .mobile-nav-toggle, .nav-backdrop { display: none !important; }
      .page { width: 100%; margin: 0; box-shadow: none; }
      .issue-index { display: none; }
      .entry { break-inside: avoid; }
      a { text-decoration: underline; }
    }
  </style>
  <style>
    /* --- Shell additions for Markdown-rendered issues --- */
    .week-links a.active { background: var(--soft); color: var(--blue); }
    .issue-content { padding-bottom: 10px; }
    .issue-content .section:first-child { border-top: 0; }
    .issue-content h3.item-title {
      margin: 0;
      color: var(--ink);
      font-family: "Poppins", sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.32;
    }
    .issue-content .item {
      padding: 26px 0 28px;
      border-bottom: 1px solid var(--rule);
    }
    .issue-content .item:last-child { border-bottom: 0; }
    .issue-content .item > *:first-child { margin-top: 0; }
    .issue-content p { margin: 10px 0 0; max-width: 760px; }
    .issue-content .item p:first-of-type { margin-top: 10px; }
    .issue-content h3.item-title + p { margin-top: 8px; }
    .issue-content a { color: var(--blue); font-weight: 700; text-underline-offset: 3px; }
    .issue-content .section.discussions a { color: var(--orange); }
    .issue-content .section.podcasts a { color: var(--purple); }
    .issue-content img {
      display: block;
      max-width: 560px;
      width: 100%;
      height: auto;
      background: var(--soft);
    }
    .issue-content figure { max-width: 560px; margin: 18px 0 2px; }
    .issue-content .trailing-note {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.55;
      max-width: none;
    }
    .issue-content .inline-note {
      margin: 28px 0 8px;
      padding: 21px 22px;
      background: var(--tint, var(--soft));
      color: var(--body);
      max-width: none;
    }
    .issue-status {
      padding: 34px 64px 44px;
      color: var(--muted);
      font-size: .9rem;
    }
    .dek:empty { display: none; }
    @media (max-width: 780px) {
      .issue-status { padding: 28px 22px 36px; }
    }
    @media print {
      .issue-content .section { break-inside: auto; }
    }
  </style>
</head>
<body>
  <button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="archive-navigation">Browse issues</button>
  <div class="nav-backdrop" aria-hidden="true"></div>
  <div class="site-shell">
    <aside class="archive-nav" id="archive-navigation" aria-label="Briefing archive navigation">
      <button class="nav-close" type="button" aria-label="Close archive">×</button>
      <p class="archive-nav-label">Jump to an issue</p>
      <h2>Archive</h2>
      <a class="latest-link" id="latest-link" href="#/2026-10-19">Latest <span>· Oct 19</span></a>
      <div id="week-groups"></div>
    </aside>
    <main class="page" id="latest">
      <header class="issue-head">
        <div class="week-strip" id="week-strip" aria-label="Week at a glance"></div>
        <p class="dateline" id="dateline"></p>
        <h1>Daily AI<br />Robotics Briefing</h1>
        <p class="dek" id="dek"></p>
      </header>
      <nav class="issue-index" id="issue-index" aria-label="Briefing sections"></nav>
      <div class="issue-content" id="issue-content"></div>
      <p class="issue-status" id="issue-status">Loading the latest issue…</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    (function () {
      var body = document.body;
      var toggle = document.querySelector('.mobile-nav-toggle');
      var backdrop = document.querySelector('.nav-backdrop');
      var nav = document.querySelector('.archive-nav');
      var closeButton = document.querySelector('.nav-close');
      var mobile = window.matchMedia('(max-width: 780px)');

      function setNav(open) {
        body.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        if (mobile.matches && !open) {
          nav.setAttribute('inert', '');
          nav.setAttribute('aria-hidden', 'true');
        } else {
          nav.removeAttribute('inert');
          nav.removeAttribute('aria-hidden');
        }
      }
      function syncNav() {
        if (mobile.matches) {
          setNav(false);
        } else {
          body.classList.remove('nav-open');
          toggle.setAttribute('aria-expanded', 'false');
          nav.removeAttribute('inert');
          nav.removeAttribute('aria-hidden');
        }
      }
      toggle.addEventListener('click', function () {
        setNav(!body.classList.contains('nav-open'));
      });
      closeButton.addEventListener('click', function () {
        setNav(false);
        toggle.focus();
      });
      backdrop.addEventListener('click', function () { setNav(false); });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') setNav(false);
      });
      nav.addEventListener('click', function (event) {
        if (event.target.closest('a') && mobile.matches) setNav(false);
      });
      if (mobile.addEventListener) mobile.addEventListener('change', syncNav);
      syncNav();

      /* ---------- Issue loading / rendering ---------- */
      var MONTHS = ['January','February','March','April','May','June','July',
                    'August','September','October','November','December'];
      var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var SECTION_CLASS = {
        'Papers': 'papers',
        'Hot Discussions': 'discussions',
        'Podcast Updates': 'podcasts'
      };
      var contentEl = document.getElementById('issue-content');
      var statusEl = document.getElementById('issue-status');
      var datelineEl = document.getElementById('dateline');
      var dekEl = document.getElementById('dek');
      var groupsEl = document.getElementById('week-groups');
      var latestLink = document.getElementById('latest-link');
      var manifest = [];
      var currentDate = null;

      function parseDate(iso) {
        var p = iso.split('-');
        return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      }
      function isoOf(d) {
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      function mondayOf(d) {
        var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        var dow = (m.getDay() + 6) % 7; // Monday = 0
        m.setDate(m.getDate() - dow);
        return m;
      }
      function shortDay(d) { return MONTHS_SHORT[d.getMonth()] + ' ' + d.getDate(); }

      function buildSidebar() {
        if (!manifest.length) return;
        var latestIso = manifest[0].date;
        var latestMonday = isoOf(mondayOf(parseDate(latestIso)));
        latestLink.setAttribute('href', '#/' + latestIso);
        latestLink.innerHTML = 'Latest <span>· ' + shortDay(parseDate(latestIso)) + '</span>';
        var groups = new Map();
        manifest.forEach(function (entry) {
          var key = isoOf(mondayOf(parseDate(entry.date)));
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(entry);
        });
        groupsEl.innerHTML = '';
        groups.forEach(function (entries, mondayIso) {
          var monday = parseDate(mondayIso);
          var details = document.createElement('details');
          details.className = 'week-group';
          details.setAttribute('data-week', mondayIso);
          var summary = document.createElement('summary');
          if (mondayIso === latestMonday) {
            var sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
            if (sunday.getMonth() === monday.getMonth()) {
              summary.textContent = MONTHS_SHORT[monday.getMonth()] + ' ' + monday.getDate() + '–' + sunday.getDate();
            } else {
              summary.textContent = shortDay(monday) + '–' + shortDay(sunday);
            }
            details.open = true;
          } else {
            summary.textContent = 'Week of ' + shortDay(monday);
          }
          details.appendChild(summary);
          var links = document.createElement('div');
          links.className = 'week-links';
          entries.forEach(function (entry) {
            var d = parseDate(entry.date);
            var a = document.createElement('a');
            a.setAttribute('href', '#/' + entry.date);
            a.setAttribute('data-date', entry.date);
            a.innerHTML = DAYS[d.getDay()] + ' <span>' + shortDay(d) + '</span>';
            links.appendChild(a);
          });
          details.appendChild(links);
          groupsEl.appendChild(details);
        });
      }

      function markActive() {
        var links = nav.querySelectorAll('.week-links a');
        links.forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('data-date') === currentDate);
        });
        if (currentDate) {
          var group = groupsEl.querySelector('details[data-week="' +
            isoOf(mondayOf(parseDate(currentDate))) + '"]');
          if (group) group.open = true;
        }
      }

      var SECTION_META = {
        'Papers': { badge: function (n) { return n + ' reads'; },
                    card: function (n) { return n + ' research note' + (n === 1 ? '' : 's'); } },
        'Hot Discussions': { badge: function (n) { return n + ' signals'; },
                    card: function (n) { return n + ' field signal' + (n === 1 ? '' : 's'); } },
        'Podcast Updates': { badge: function (n) { return n + ' episode' + (n === 1 ? '' : 's'); },
                    card: function (n) { return n + ' episode' + (n === 1 ? '' : 's'); } }
      };
      var issueIndexEl = document.getElementById('issue-index');

      function sectionize(root) {
        // Group rendered nodes into <section class="section ..."> per <h2>.
        var nodes = Array.prototype.slice.call(root.childNodes);
        var section = null;
        nodes.forEach(function (node) {
          if (node.nodeType === 1 && node.tagName === 'H2') {
            var name = node.textContent.trim();
            section = document.createElement('section');
            var cls = SECTION_CLASS[name] || '';
            section.className = 'section ' + cls;
            if (cls) section.id = cls;
            root.insertBefore(section, node);
            var heading = document.createElement('div');
            heading.className = 'section-heading';
            section.appendChild(heading);
            heading.appendChild(node);
            var badge = document.createElement('span');
            badge.className = 'count';
            badge.setAttribute('data-badge-for', name);
            heading.appendChild(badge);
            var rule = document.createElement('div');
            rule.className = 'section-rule';
            rule.setAttribute('aria-hidden', 'true');
            section.appendChild(rule);
          } else if (section) {
            section.appendChild(node);
          }
        });
        // Wrap each item (title + following siblings) in .entry containers
        // with the entry numbers the original page used (01, 02, ...).
        root.querySelectorAll('section.section').forEach(function (sec) {
          var kids = Array.prototype.slice.call(sec.children);
          var item = null;
          var num = 0;
          kids.forEach(function (kid) {
            if (kid.tagName === 'H3' && kid.classList.contains('item-title')) {
              num += 1;
              item = document.createElement('article');
              item.className = 'entry item';
              sec.insertBefore(item, kid);
              var numEl = document.createElement('span');
              numEl.className = 'entry-num';
              numEl.textContent = (num < 10 ? '0' : '') + num;
              item.appendChild(numEl);
              item.appendChild(kid);
            } else if (item) {
              item.appendChild(kid);
            }
          });
          sec.setAttribute('data-item-count', num);
        });
        // Fill the count badges and build the issue-index cards under the
        // header (Papers / Hot Discussions / Podcast Updates at a glance).
        issueIndexEl.innerHTML = '';
        root.querySelectorAll('section.section').forEach(function (sec) {
          var h2 = sec.querySelector('h2');
          if (!h2) return;
          var name = h2.textContent.trim();
          var meta = SECTION_META[name];
          if (!meta) return;
          var n = parseInt(sec.getAttribute('data-item-count') || '0', 10);
          var badge = sec.querySelector('.count');
          if (badge) badge.textContent = n ? meta.badge(n) : 'Nothing notable';
          var a = document.createElement('a');
          a.className = 'index-link ' + (SECTION_CLASS[name] || '');
          a.href = '#' + (SECTION_CLASS[name] || '');
          a.addEventListener('click', function (ev) {
            ev.preventDefault();
            sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          a.appendChild(document.createTextNode(name));
          var sub = document.createElement('span');
          sub.textContent = n ? meta.card(n) : 'Nothing notable today';
          a.appendChild(sub);
          issueIndexEl.appendChild(a);
        });
      }

      function postProcess(root) {
        // The MD h1 duplicates the shell header (branding + dateline): drop it.
        var h1 = root.querySelector('h1');
        var dekText = '';
        if (h1) {
          var next = h1.nextElementSibling;
          if (next && next.tagName === 'P' && root.querySelector('h2')) {
            // First paragraph before the first section is the edition dek.
            var firstH2 = root.querySelector('h2');
            if (next.compareDocumentPosition(firstH2) & Node.DOCUMENT_POSITION_FOLLOWING) {
              dekText = next.innerHTML;
              next.remove();
            }
          }
          h1.remove();
        }
        dekEl.innerHTML = dekText;
        // Item titles: <p><strong>…</strong></p> -> <h3 class="item-title">
        root.querySelectorAll('p').forEach(function (p) {
          var kids = Array.prototype.slice.call(p.childNodes).filter(function (n) {
            return !(n.nodeType === 3 && !n.textContent.trim());
          });
          if (kids.length === 1 && kids[0].nodeType === 1 && kids[0].tagName === 'STRONG') {
            var h3 = document.createElement('h3');
            h3.className = 'item-title';
            h3.innerHTML = kids[0].innerHTML;
            p.replaceWith(h3);
          }
        });
        // Image paths in the MD files are written relative to reports/
        // (../assets/...) so they also resolve on GitHub; the shell sits at
        // the site root, so normalize them to root-relative asset paths.
        root.querySelectorAll('img').forEach(function (img) {
          var s = img.getAttribute('src') || '';
          while (s.indexOf('../') === 0) s = s.slice(3);
          if (s !== (img.getAttribute('src') || '')) img.setAttribute('src', s);
        });
        // Images: <p><img></p> (+ optional <p><em>caption</em></p>) -> <figure>
        root.querySelectorAll('p').forEach(function (p) {
          var kids = Array.prototype.slice.call(p.childNodes).filter(function (n) {
            return !(n.nodeType === 3 && !n.textContent.trim());
          });
          if (kids.length === 1 && kids[0].nodeType === 1 && kids[0].tagName === 'IMG') {
            var fig = document.createElement('figure');
            fig.appendChild(kids[0]);
            p.replaceWith(fig);
            var sib = fig.nextElementSibling;
            if (sib && sib.tagName === 'P') {
              var sk = Array.prototype.slice.call(sib.childNodes).filter(function (n) {
                return !(n.nodeType === 3 && !n.textContent.trim());
              });
              if (sk.length === 1 && sk[0].nodeType === 1 && sk[0].tagName === 'EM') {
                var cap = document.createElement('figcaption');
                cap.innerHTML = sk[0].innerHTML;
                fig.appendChild(cap);
                sib.remove();
              }
            }
          }
        });
        // Notes styling.
        root.querySelectorAll('p').forEach(function (p) {
          var t = p.textContent.trim();
          if (/^Note:/.test(t)) p.classList.add('inline-note');
          if (/^Coverage note\./.test(t) || /^This edition covered/.test(t) ||
              /^All links/.test(t) || /^Covering roughly/.test(t)) {
            p.classList.add('trailing-note');
          }
        });
        // External links open in a new tab, as on the original site.
        root.querySelectorAll('a[href^="http"]').forEach(function (a) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        });
        sectionize(root);
      }

      var weekStripEl = document.getElementById('week-strip');
      var DOW_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      var DOW_GLYPH = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      function buildWeekStrip(iso) {
        // Monday-start week containing the viewed issue (same grouping as
        // the sidebar). The issue's own day is filled; if the real today
        // falls in this week it gets the orange "today" marker.
        var d = parseDate(iso);
        var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
        var now = new Date();
        var todayIso = now.getFullYear() + '-' +
          ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
        weekStripEl.innerHTML = '';
        for (var i = 0; i < 7; i++) {
          var day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
          var dayIso = day.getFullYear() + '-' +
            ('0' + (day.getMonth() + 1)).slice(-2) + '-' + ('0' + day.getDate()).slice(-2);
          var chip = document.createElement('span');
          chip.className = 'day-chip' +
            (dayIso === iso ? ' is-issue' : '') +
            (dayIso === todayIso ? ' is-today' : '');
          var glyph = document.createElement('span');
          glyph.className = 'glyph';
          glyph.textContent = DOW_GLYPH[i];
          var dow = document.createElement('span');
          dow.className = 'dow';
          dow.textContent = DOW_SHORT[i];
          chip.appendChild(glyph);
          chip.appendChild(dow);
          if (dayIso === todayIso) {
            var dot = document.createElement('span');
            dot.className = 'today-dot';
            chip.appendChild(dot);
          }
          weekStripEl.appendChild(chip);
        }
      }

      function loadIssue(iso) {
        var entry = null;
        manifest.forEach(function (e) { if (e.date === iso) entry = e; });
        if (!entry) { entry = manifest[0]; iso = entry.date; }
        currentDate = iso;
        var d = parseDate(iso);
        document.title = entry.title;
        datelineEl.textContent = DAYS[d.getDay()] + ' · ' +
          MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        buildWeekStrip(iso);
        statusEl.style.display = '';
        statusEl.textContent = 'Loading…';
        contentEl.innerHTML = '';
        markActive();
        fetch('reports/' + iso + '.md')
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function (md) {
            var raw = marked.parse(md);
            var clean = window.DOMPurify ? DOMPurify.sanitize(raw) : raw;
            contentEl.innerHTML = clean;
            postProcess(contentEl);
            statusEl.style.display = 'none';
            window.scrollTo(0, 0);
          })
          .catch(function (err) {
            statusEl.textContent = 'Could not load this issue (' + err.message + ').';
          });
      }

      function route() {
        var m = window.location.hash.match(/(\d{4}-\d{2}-\d{2})/);
        loadIssue(m ? m[1] : manifest[0].date);
      }

      fetch('reports/index.json')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          manifest = data;
          buildSidebar();
          window.addEventListener('hashchange', route);
          route();
        })
        .catch(function (err) {
          statusEl.textContent = 'Could not load the issue index (' + err.message + ').';
        });
    }());
  </script>
</body>
</html>
